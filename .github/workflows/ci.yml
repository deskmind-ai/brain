name: ci

# The unit tests, which need no Mac, no model and no GPU: the client, the router, the metrics and the server's auth
# and threshold handling run against stubs. Serving with MLX and the evals are checked on a Mac before a release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The protocol registry (deskmind protocol/), so tests/test_heads.py checks heads_for against it here too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: deskmind-ai/deskmind
          path: .deps/deskmind
          sparse-checkout: protocol
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv run --python 3.12 --group dev --with pyyaml pytest -q -rs
        env:
          DESKMIND_REPO: ${{ github.workspace }}/.deps/deskmind
