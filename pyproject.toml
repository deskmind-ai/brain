[project]
name = "deskmind-brain"
version = "0.2.0"
description = "Typed, calibrated step-decision models for computer-use agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "The DeskMind authors"}]
keywords = ["computer-use", "agents", "calibration", "decision-model", "mlx", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/deskmind-ai/brain"
Repository = "https://github.com/deskmind-ai/brain"
Issues = "https://github.com/deskmind-ai/brain/issues"

[project.scripts]
deskmind-brain-eval = "deskmind_brain.eval.cli:main"
deskmind-brain-serve = "deskmind_brain.serve:main"

[project.optional-dependencies]
eval = [
    "pyarrow>=25.0.1",  # parquet eval sources only; serving does not need it
]
local = [
    "accelerate>=1.15.0",
    "modelscope>=1.40.1",
    "torch>=2.14.0",
    # 5.18 with mlx 0.32.3 / mlx-lm 0.32 made every request fail ("Initialization encountered non-uniform
    # length"); upper bounds until the newer stack is tested
    "transformers>=5.17.0,<5.18",
]
cuda = [
    "flash-linear-attention>=0.5.2 ; sys_platform == 'linux'",
]
mlx = [
    "mlx-lm>=0.31,<0.32 ; sys_platform == 'darwin'",
    "mlx>=0.32,<0.32.3 ; sys_platform == 'darwin'",
]
train = [
    "peft>=0.19",
    "lxml>=5",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deskmind_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
